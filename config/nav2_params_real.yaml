amcl:
  ros__parameters:
    use_sim_time: False
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0, 0.0] # [x, y, z, yaw]
    alpha1: 0.7
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5
    alpha5: 0.7
    base_frame_id: "eddie_base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 9.0
    laser_min_range: 0.06
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.01
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.01
    scan_topic: /scan
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: eddie_base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # set by navigation.launch.py to behavior_trees/navigate_to_pose_zones.xml
    default_nav_to_pose_bt_xml: ""
    # built-in plugins are added automatically
    plugin_lib_names: ["eddie_zone_bt_nodes"]
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
# the BT nodes' own node, as nav2's BtActionServer names it
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    # maps/<world>_zones.yaml, set by navigation.launch.py; empty: no zones
    zones_file: ""
constrained_pass:
  ros__parameters:
    use_sim_time: False
    robot_base_frame: eddie_base_link
    global_frame: map
    costmap_topic: local_costmap/costmap
    cmd_vel_topic: cmd_vel_nav
    # the real base (MJCF 0.62 x 0.66 m), not nav2's padded footprint: doors clear ~0.72 m
    check_footprint: "[ [0.31, 0.33], [0.31, -0.33], [-0.31, -0.33], [-0.31, 0.33] ]"
    rate: 20.0
    k_pos: 1.0
    k_yaw: 1.5
    correction_speed_max: 0.1
    correction_turn_max: 0.6
    turn_speed_min: 0.15
    align_speed_min: 0.03
    timeout: 60.0
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.15
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # shim: one smooth on-the-spot turn to the goal heading; MPPI (Jazzy defaults, Omni) drives
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      # above pi: never turns to face the path first (omni drives in any direction)
      angular_dist_threshold: 3.2
      rotate_to_goal_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0
      closed_loop: true
      simulate_ahead_time: 1.0
      time_steps: 32
      model_dt: 0.05
      batch_size: 1000
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      ay_min: -1.0
      az_max: 1.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.4
      vx_min: -0.35
      vy_max: 0.4
      wz_max: 0.4
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        near_collision_cost: 254
        critical_cost: 300.0
        # rectangular base in 0.8 m doors: check the footprint, not the inscribed circle
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # omni: no preferred direction; doors are driven forward by door_navigator.py
        mode: 1
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: False
    footprint_padding: 0.0
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: eddie_base_link
    rolling_window: true
    width: 9
    height: 9
    resolution: 0.025
    footprint: "[ [0.33, 0.35], [0.33, -0.35], [-0.33, -0.35], [-0.33, 0.35] ]"
    plugins: ["obstacle_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      # at least the footprint's circumscribed radius (0.48)
      inflation_radius: 0.50
      # steep decay leaves 0.8 m doorways passable
      cost_scaling_factor: 10.0
      enabled: True
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      scan:
        topic: /scan
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        obstacle_max_range: 3.0
        obstacle_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        inf_is_valid: false
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
      enabled: true
    always_send_full_costmap: True
global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: False
    footprint_padding: 0.0
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: eddie_base_link
    resolution: 0.025
    footprint: "[ [0.33, 0.35], [0.33, -0.35], [-0.33, -0.35], [-0.33, 0.35] ]"
    track_unknown_space: true
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      scan:
        topic: /scan
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        obstacle_max_range: 3.0
        obstacle_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        inf_is_valid: false
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
      enabled: true
      subscribe_to_updates: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      # at least the footprint's circumscribed radius (0.48)
      inflation_radius: 0.50
      # steep decay leaves 0.8 m doorways passable
      cost_scaling_factor: 10.0
      inflate_unknown: false
      inflate_around_unknown: true
    always_send_full_costmap: True
map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 15.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: false # true replaces the goal yaw with the path's heading
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: eddie_base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 3.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.6, 0.6]
    min_velocity: [-0.6, -0.6, -0.6]
    max_accel: [1.0, 1.0, 1.0]
    max_decel: [-1.0, -1.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "eddie_base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "slowdown"
      polygon_sub_topic: "/local_costmap/published_footprint"
      #time_before_collision: 0.5
      #simulation_time_step: 0.02
      min_points: 15
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
collision_detector:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "eddie_base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    polygons: ["PolygonFront"]
    PolygonFront:
      type: "polygon"
      points: "[ [0.35, 0.35], [0.35, -0.35], [-0.35, -0.35], [-0.35, 0.35] ]"
      action_type: "none"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_front"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
