game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 10       # RB
    axis_linear:
      x: 1                  # left stick vertical
      y: 0                  # left stick horizontal
    scale_linear:
      x: 1.0                # [m/s]
      y: 1.0                # [m/s]
    axis_angular:
      yaw: 2                # right stick horizontal
    scale_angular:
      yaw: 1.0              # [rad/s]
